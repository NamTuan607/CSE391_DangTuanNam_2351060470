<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <section class="todo-app" aria-label="Todo application">
            <header class="hero">
                <p class="eyebrow">PBT 09</p>
                <h1>Todo App</h1>
                <p class="subtitle">Add, edit, filter, and persist tasks with vanilla JavaScript.</p>
            </header>

            <form id="todoForm" class="todo-form" autocomplete="off">
                <input id="todoInput" type="text" placeholder="What needs to be done?" aria-label="Todo text">
                <button type="submit">Add</button>
            </form>

            <div class="toolbar">
                <div class="filters" role="tablist" aria-label="Todo filters">
                    <button type="button" class="filter-btn active" data-filter="all">All</button>
                    <button type="button" class="filter-btn" data-filter="active">Active</button>
                    <button type="button" class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <button type="button" id="clearCompleted" class="ghost-btn">Clear completed</button>
            </div>

            <section class="status-bar">
                <span id="todoCount">0 items left</span>
            </section>

            <ul id="todoList" class="todo-list" aria-live="polite"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>

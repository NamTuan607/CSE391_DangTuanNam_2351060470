<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox Navigation & Cards</title>
  <link rel="stylesheet" href="flexbox.css">
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo">MyBrand</div>

      <nav class="menu">
        <a href="#home">Home</a>

    </div>
